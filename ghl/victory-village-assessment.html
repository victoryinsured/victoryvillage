      '<p class="hint" style="margin-top:14px">Free &middot; Your results show right away</p></div>';
    document.getElementById('vva-start').onclick = function () { i = 0; question(); };
  }

  function question() {
    head.hidden = true;
    var q = Q[i], cur = answers[q.id], multi = q.type === 'multi', long = q.opts.some(function (o) { return o.length > 46; });
    var html = '<div class="step">' +
      '<div class="progress"><div class="bar"><i style="width:' + Math.round(i / Q.length * 100) + '%"></i></div><div class="count">' + (i + 1) + ' / ' + Q.length + '</div></div>' +
      '<h2>' + esc(q.text) + '</h2>' + (q.hint ? '<p class="hint">' + esc(q.hint) + '</p>' : '') +
      '<div class="opts' + (long ? ' one' : '') + '" role="group" aria-label="' + esc(q.text) + '">';
    q.opts.forEach(function (o, k) {
      var on = multi ? (cur || []).indexOf(o) > -1 : cur === o;
      html += '<button type="button" class="opt' + (multi ? ' multi' : '') + '" data-k="' + k + '" aria-pressed="' + on + '"><span class="mark"></span><span>' + esc(o) + '</span></button>';
    });
    html += '</div><div class="nav"><button type="button" class="back" id="vva-back">&larr; Back</button>' +
      '<button type="button" class="btn" id="vva-next"' + (cur && (!multi || cur.length) ? '' : ' disabled') + '>' + (i === Q.length - 1 ? 'See My Results' : 'Next') + ' <span aria-hidden="true">&rarr;</span></button></div></div>';
    card.innerHTML = html;
    var next = document.getElementById('vva-next');
    [].forEach.call(card.querySelectorAll('.opt'), function (b) {
      b.onclick = function () {
        var o = q.opts[+b.getAttribute('data-k')];
        if (multi) {
          var list = (answers[q.id] || []).slice(), at = list.indexOf(o);
          if (at > -1) list.splice(at, 1); else if (list.length < q.max) list.push(o);
          answers[q.id] = list;
          [].forEach.call(card.querySelectorAll('.opt'), function (x) { x.setAttribute('aria-pressed', list.indexOf(q.opts[+x.getAttribute('data-k')]) > -1); });
          next.disabled = !list.length;
        } else {
          answers[q.id] = o;
          [].forEach.call(card.querySelectorAll('.opt'), function (x) { x.setAttribute('aria-pressed', x === b); });
          next.disabled = false;
          setTimeout(advance, 260);   // single-choice questions move on by themselves
        }
      };
    });
    next.onclick = advance;
    document.getElementById('vva-back').onclick = function () { if (i === 0) intro(); else { i--; question(); } };
    var first = card.querySelector('.opt'); if (first) first.focus({ preventScroll: true });
  }
  function advance() { if (i < Q.length - 1) { i++; question(); } else contactStep(); }

  function contactStep() {
    card.innerHTML = '<div class="step">' +
      '<div class="progress"><div class="bar"><i style="width:100%"></i></div><div class="count">Done</div></div>' +
      '<div class="eyebrow">Your results are ready</div>' +
      '<h2>Where should we send your Career Lane report?</h2>' +
      '<form id="vva-form" novalidate>' +
      '<label>First name<input type="text" id="vva-first" autocomplete="given-name" required></label>' +
      '<label>Last name<input type="text" id="vva-last" autocomplete="family-name"></label>' +
      '<label class="full">Email<input type="email" id="vva-email" autocomplete="email" required></label>' +
      '<label class="full">Phone (optional)<input type="tel" id="vva-phone" autocomplete="tel"></label>' +
      '<label class="consent"><input type="checkbox" id="vva-consent"><span>I agree to receive my results and career tips from Victory Society by email. I can unsubscribe anytime. See our <a href="https://thevictoryvillage.com/privacypolicy-village" target="_blank" rel="noopener" style="text-decoration:underline">Privacy Policy</a>.</span></label>' +
      '<p class="err" id="vva-err" role="alert"></p>' +
      '<button class="btn" type="submit">Show My Results <span aria-hidden="true">&rarr;</span></button>' +
      '</form>' +
      '<div class="nav"><button type="button" class="back" id="vva-back">&larr; Back</button><span></span></div></div>';
    document.getElementById('vva-back').onclick = function () { i = Q.length - 1; question(); };
    document.getElementById('vva-first').focus({ preventScroll: true });
    document.getElementById('vva-form').onsubmit = function (e) {
      e.preventDefault();
      var first = document.getElementById('vva-first').value.trim(), email = document.getElementById('vva-email').value.trim(), err = document.getElementById('vva-err');
      if (!first) { err.textContent = 'Please enter your first name.'; return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'Please enter a valid email address.'; return; }
      if (!document.getElementById('vva-consent').checked) { err.textContent = 'Please check the box so we can send your results.'; return; }
      contact = { first_name: first, last_name: document.getElementById('vva-last').value.trim(), email: email, phone: document.getElementById('vva-phone').value.trim() };
      results();
    };
  }

  function send(payload) {
    if (!WEBHOOK_URL) return;
    var body = JSON.stringify(payload);
    fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body })
      .catch(function () { fetch(WEBHOOK_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: body }).catch(function () {}); });
  }

  function results() {
    var key = pickLane(answers), lane = LANES[key], ready = pickReadiness(answers);
    send({
      first_name: contact.first_name, last_name: contact.last_name, email: contact.email, phone: contact.phone,
      career_lane: lane.name, lane_tag: lane.tag, readiness: ready, readiness_tag: 'assessment-' + ready,
      tags: [lane.tag, 'assessment-' + ready, 'assessment-complete'],
      field: answers.field, years: answers.years, claims_experience: answers.claims_exp, license: answers.license,
      strengths: (answers.strengths || []).join(', '), work_style: answers.work_style, travel: answers.travel,
      timeline: answers.timeline, obstacle: answers.obstacle, salary_goal: answers.salary,
      source: 'Victory Career Assessment', submitted_at: new Date().toISOString(), page: location.href
    });
    function pills(list, cls) { return '<div class="pills">' + list.map(function (t) { return '<span class="pill ' + (cls || '') + '">' + esc(t) + '</span>'; }).join('') + '</div>'; }
    var next = ready === 'ready'
      ? '<div class="eyebrow">Your next step</div><p>You already have experience to work with. A 1:1 Strategy Session with Victoria looks at your exact situation and shows you what to change so you start landing interviews and offers. Only 10 sessions open each quarter.</p>' +
        '<a class="btn" href="' + SESSION_URL + '">Book a Strategy Session &mdash; $100 <span aria-hidden="true">&rarr;</span></a>' +
        '<p class="fine">Prefer to start on your own? <a href="' + TOOLKIT_URL + '">Get the Victory Toolkit for $47/month</a>.</p>'
      : '<div class="eyebrow">Your next step</div><p>The Victory Toolkit gives you the AI Victory Coach, job matching for your lane, and an application tracker so you can start applying with focus instead of guessing.</p>' +
        '<a class="btn" href="' + TOOLKIT_URL + '">Get the Victory Toolkit &mdash; $47/month <span aria-hidden="true">&rarr;</span></a>' +
        '<p class="fine">Cancel anytime &middot; Want the community too? <a href="' + PRO_URL + '">See Victory Society Pro</a>.</p>';
    card.innerHTML = '<div class="step">' +
      '<div class="eyebrow">' + esc(contact.first_name) + ', your Career Lane is</div>' +
      '<div class="lane-name">' + esc(lane.name) + '</div>' +
      '<p class="sub">' + esc(lane.intro) + '</p>' +
      '<div class="res-grid">' +
      '<div class="res-box full"><h3>Claims roles to target</h3>' + pills(lane.roles, 'role') + '</div>' +
      '<div class="res-box"><h3>Skills you’re bringing</h3>' + pills(lane.skills) + '</div>' +
      '<div class="res-box"><h3>Where it can lead</h3>' + pills(lane.grow) + '</div>' +
      '</div><div class="next">' + next + '</div>' +
      '<p class="hint" style="margin-top:18px">A copy of your results is on its way to ' + esc(contact.email) + '.</p></div>';
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  intro();
})();
</script>
